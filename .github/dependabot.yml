version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Replaces Dependabot's default dependencies/github_actions labels, which
    # the estate label rollout folds into kind:chore (cadence-ecosystem#553).
    labels:
      - "kind:chore"
  # The pinned OpenSpec CLI behind scripts/openspec.sh (#1446).
  - package-ecosystem: "npm"
    directory: "/scripts/openspec"
    schedule:
      interval: "weekly"
    labels:
      - "kind:chore"
