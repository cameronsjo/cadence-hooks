name: Release

on:
  push:
    tags: ["v*"]

# Deny by default; each job grants what it needs. Only `release` can request
# an OIDC token, so only it can sign as this workflow (security review I-6).
permissions: {}

env:
  CARGO_TERM_COLOR: always

# Serialize runs. Each tag is a unique artifact (different version,
# different release, different homebrew dispatch) so cancel-in-progress
# is false — we queue rather than drop work.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # A `v*` tag names a release, and the signing identity below is
  # `release.yml@refs/tags/v*`. The tag ruleset lets only the Forge Bellows App
  # create one, and auto-tag.yml does that after a gated merge. This job is
  # the second check: the tagged commit must be on main and CI's push run for
  # it must have succeeded. Nothing builds or signs until it passes.
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read # compare the tagged commit with main
      actions: read # read CI's workflow runs
    steps:
      - name: Tagged commit is on main with green CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # CI is identified by its workflow file, not by "any green check":
          # another app or workflow's success must not stand in for it.
          CI_WORKFLOW: ci.yml
          # CI takes about 5 minutes; 45 leaves room for a queue.
          POLL_SECONDS: 30
          POLL_LIMIT: 90
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::github.sha is not 40-hex"; exit 1; }

          # Resolve the branch by its full ref first, so a tag named `main`
          # cannot stand in for it. `<main>...SHA` is `behind` or `identical`
          # exactly when SHA is an ancestor of main (or main itself).
          main_sha="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve refs/heads/main"; exit 1; }
          status="$(gh api "repos/${REPO}/compare/${main_sha}...${SHA}" --jq .status)"
          case "$status" in
            behind | identical) echo "${SHA} is on main (${status})." ;;
            *) echo "::error::${SHA} is not an ancestor of main (compare status: ${status})"; exit 1 ;;
          esac

          for ((i = 1; i <= POLL_LIMIT; i++)); do
            # The newest push-event run of CI on main for exactly this commit.
            run="$(gh api "repos/${REPO}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${SHA}&event=push&branch=main&per_page=100" \
              | jq -c '.workflow_runs | if type == "array" then (sort_by(.created_at) | last // {}) else error("not an array") end')"
            state="$(jq -r '"\(.status // "none")/\(.conclusion // "none")"' <<< "$run")"
            case "$state" in
              completed/success)
                echo "CI run $(jq -r .html_url <<< "$run") succeeded for ${SHA}."
                exit 0 ;;
              completed/*)
                echo "::error::CI ($(jq -r .html_url <<< "$run")) concluded ${state#completed/} for ${SHA}; not releasing."
                exit 1 ;;
            esac
            echo "CI for ${SHA} is ${state} (poll ${i}/${POLL_LIMIT})."
            sleep "$POLL_SECONDS"
          done
          echo "::error::CI never completed for ${SHA} within the poll limit; not releasing."
          exit 1

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
          # Both macOS targets build on the GitHub-hosted `macos-latest` image,
          # which is free for this public repo and runs on arm64.
          # x86_64-apple-darwin cross-compiles from it with the stock Xcode SDK.
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build release binary
        # Force bash so the conditional runs the same on the Windows runner,
        # whose default shell is PowerShell.
        shell: bash
        env:
          USE_CROSS: ${{ matrix.use-cross }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "${USE_CROSS}" = "true" ]; then
            cross build --release --target "${TARGET}"
          else
            cargo build --release --target "${TARGET}"
          fi

      # Unix legs ship a .tar.gz of the suffix-less binary; Windows ships a
      # .zip of cadence-hooks.exe. Both export ARCHIVE for the upload step.
      - name: Create tarball (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="cadence-hooks-${VERSION}-${MATRIX_NAME}.tar.gz"
          tar -czf "${ARCHIVE}" -C "target/${TARGET}/release" cadence-hooks
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Create zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          $version = $env:GITHUB_REF_NAME
          $archive = "cadence-hooks-$version-$env:MATRIX_NAME.zip"
          Compress-Archive -Path "target/$env:TARGET/release/cadence-hooks.exe" -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  release:
    name: Create Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    # The only job that can sign: cosign and both attestations run here, in
    # release.yml itself, so the certificate identity stays this file at the
    # tag. It holds no App key; the tap update is its own job below.
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # keyless cosign and attestation signing
      attestations: write # store the attestations
    outputs:
      sha_macos_x86_64: ${{ steps.shas.outputs.sha_macos_x86_64 }}
      sha_macos_aarch64: ${{ steps.shas.outputs.sha_macos_aarch64 }}
      sha_linux_x86_64: ${{ steps.shas.outputs.sha_linux_x86_64 }}
      sha_linux_aarch64: ${{ steps.shas.outputs.sha_linux_aarch64 }}
    steps:
      # Checkout + toolchain are needed for the CycloneDX SBOM step below — the
      # release job otherwise only consumes the build job's artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum cadence-hooks-*.tar.gz cadence-hooks-*.zip > checksums.txt

      # CycloneDX SBOM for the shipped binary. The root package `cadence-hooks`
      # carries the full transitive graph (all 8 workspace crates + their deps),
      # so a single root-package SBOM is the complete bill of materials — no
      # per-crate aggregation needed. One platform-independent file ships.
      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json
          SBOM="cadence-hooks-${GITHUB_REF_NAME}.cdx.json"
          # cargo-cyclonedx writes <package>.cdx.json next to the manifest;
          # promote the root package's SBOM to the release asset name.
          GENERATED=$(find . -maxdepth 1 -name '*.cdx.json' | head -1)
          mv "${GENERATED}" "${SBOM}"
          echo "SBOM=${SBOM}" >> "${GITHUB_ENV}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cadence-hooks-*.tar.gz
            cadence-hooks-*.zip

      # Attest the SBOM against the binaries it describes. Complements (does not
      # replace) the build-provenance attestation above.
      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            cadence-hooks-*.tar.gz
            cadence-hooks-*.zip
          sbom-path: ${{ env.SBOM }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Detached keyless signature over checksums.txt — one signature covers
      # every artifact by hash (goreleaser convention). Gives an offline,
      # GitHub-independent verification path via `cosign verify-blob`, distinct
      # from `gh attestation verify`. The bundle embeds the signature + Fulcio
      # cert + Rekor inclusion proof in one file.
      - name: Sign checksums with Cosign (keyless)
        run: cosign sign-blob --yes --bundle checksums.txt.cosign.bundle checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            cadence-hooks-*.tar.gz
            cadence-hooks-*.zip
            checksums.txt
            checksums.txt.cosign.bundle
            ${{ env.SBOM }}

      - name: Parse checksums for Homebrew
        id: shas
        run: |
          set -euo pipefail
          for platform in macos-x86_64 macos-aarch64 linux-x86_64 linux-aarch64; do
            SHA="$(awk -v p="$platform" 'index($2, p) {print $1}' checksums.txt)"
            KEY=$(echo "$platform" | tr '-' '_')
            [[ "$SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no sha256 for ${platform} in checksums.txt"; exit 1; }
            echo "sha_${KEY}=${SHA}" >> "$GITHUB_OUTPUT"
          done

  # The App key is minted here, away from the build tooling and the signing
  # job: this job checks out nothing and runs one pinned action plus `gh`. It
  # receives only the four checksums (security review I-1).
  homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # RELEASE_APP_PRIVATE_KEY lives only in the `release` environment, whose
    # deployment policy allows `main` and `v*` tags (ADR-0044 (i)).
    environment: release
    permissions: {}
    steps:
      - name: Check checksums
        env:
          SHAS: >-
            ${{ needs.release.outputs.sha_macos_x86_64 }}
            ${{ needs.release.outputs.sha_macos_aarch64 }}
            ${{ needs.release.outputs.sha_linux_x86_64 }}
            ${{ needs.release.outputs.sha_linux_aarch64 }}
        run: |
          set -euo pipefail
          n=0
          for sha in $SHAS; do
            [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::not a sha256: ${sha}"; exit 1; }
            n=$((n + 1))
          done
          [[ "$n" == 4 ]] || { echo "::error::expected 4 checksums, got ${n}"; exit 1; }

      - name: Generate Forge Bellows token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id, not the deprecated app-id — see auto-tag.yml for why the
          # numeric App ID in RELEASE_APP_ID stays valid under the new key, and
          # why the rename requires v3.1.0+ (not v2, and not v3.0.0).
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ github.ref_name }}
          SHA_MACOS_X86_64: ${{ needs.release.outputs.sha_macos_x86_64 }}
          SHA_MACOS_AARCH64: ${{ needs.release.outputs.sha_macos_aarch64 }}
          SHA_LINUX_X86_64: ${{ needs.release.outputs.sha_linux_x86_64 }}
          SHA_LINUX_AARCH64: ${{ needs.release.outputs.sha_linux_aarch64 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag is not vX.Y.Z: ${VERSION}"; exit 1; }
          gh api repos/cameronsjo/homebrew-tap/dispatches \
            -f event_type=update-formula \
            -f "client_payload[formula]=cadence-hooks" \
            -f "client_payload[version]=${VERSION#v}" \
            -f "client_payload[sha_macos_x86_64]=${SHA_MACOS_X86_64}" \
            -f "client_payload[sha_macos_aarch64]=${SHA_MACOS_AARCH64}" \
            -f "client_payload[sha_linux_x86_64]=${SHA_LINUX_X86_64}" \
            -f "client_payload[sha_linux_aarch64]=${SHA_LINUX_AARCH64}"
