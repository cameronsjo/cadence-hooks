name: Release environment lint

# Refuses any workflow that names the `release` environment under a
# pull_request_target, workflow_run, or issue_comment trigger (cadence-ecosystem
# ADR-0044 (i)). Vendored from cadence-ecosystem scripts/release/. Also
# refuses a workflow that could run the `macos-signing` environment from
# anything but a `v*` tag push (lint-signing-env.sh, this repo only).
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: release-env-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - run: bash .github/scripts/lint-release-env.sh
      # macos-signing (Developer ID key, notary password) must stay tag-only
      # (cameronsjo/cadence-hooks#280).
      - run: bash .github/scripts/lint-signing-env.sh
