name: plugin-hooks-skew

# Reusable gate for cadence plugins: a plugin's hooks.json must only reference
# cadence-hooks subcommands present in the LATEST RELEASED binary. Each plugin
# calls this from a thin hooks-skew.yml. Enforces "release the binary before the
# plugin wiring goes live", so a SessionStart `doctor` skew advisory never
# reaches users on the tap (claude-configurations #223).
#
# When called, actions/checkout checks out the CALLER plugin's repo, so
# `doctor --root .` scans that plugin's hooks.json.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label for the doctor job. Defaults to ubuntu-latest, which is
          free for a public caller. A private caller passes its own
          self-hosted label, because a reusable workflow bills the caller.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  doctor:
    # The runner comes from the caller (the runs-on input). A reusable
    # workflow bills the repo that calls it, so a public caller runs free on
    # the ubuntu-latest default and a private caller passes its own label.
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install latest released cadence-hooks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo cameronsjo/cadence-hooks --json tagName --jq .tagName)"
          echo "Latest released cadence-hooks: $tag"
          # --clobber: a fresh GitHub-hosted runner has no prior /tmp/ch, but
          # --clobber is cheap insurance against a re-run reusing the same
          # job workspace, and a leftover same-version tarball failing the
          # download with "already exists" before any skew logic runs was
          # observed 2026-08-03 on the previous self-hosted runner.
          gh release download "$tag" --repo cameronsjo/cadence-hooks \
            --pattern "*linux-x86_64.tar.gz" --dir /tmp/ch --clobber
          # Exact filename, never a glob: a re-run reusing /tmp/ch could leave
          # TWO tarballs matching *linux-x86_64.tar.gz after a version
          # rollover, and tar would read the older one as the archive with
          # the newer one as a member name ("Not found in archive" — observed
          # on the previous self-hosted runner's first rollover after the
          # --clobber fix, v0.75.1 -> v0.76.0, 2026-08-12).
          tar -xzf "/tmp/ch/cadence-hooks-${tag}-linux-x86_64.tar.gz" -C /tmp/ch
          bin="$(find /tmp/ch -type f -name cadence-hooks | head -n1)"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$bin" "$HOME/.local/bin/cadence-hooks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cadence-hooks" --version

      # Verbose doctor exits non-zero on subcommand skew (1) or a shell-expansion
      # bug (2). NOT --quiet: that suppresses the skew warning's exit code (it's
      # the non-blocking SessionStart preflight mode).
      - name: doctor — released binary must support every wired subcommand
        run: cadence-hooks doctor --root .
