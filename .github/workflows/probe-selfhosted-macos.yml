name: Probe self-hosted macOS

# Temporary. Proves two things before the release workflow depends on them:
#   1. `runs-on: ${{ matrix.os }}` resolves when `os` is a label ARRAY
#   2. the M1 Max daemon tier can execute a job at all — it has been registered
#      and idle since it was built, so nothing has ever run on it
# Deleted in this same PR once both are observed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: array-form
            os: [self-hosted, macOS, ARM64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Report what we landed on
        run: |
          echo "runner name: ${RUNNER_NAME:-unset}"
          echo "whoami: $(whoami)"
          echo "arch: $(uname -m)"
          echo "PATH: $PATH"
          echo "tmux: $(command -v tmux || echo ABSENT)"
          echo "swift: $(command -v swift || echo ABSENT)"
          echo "brew prefix owner: $(stat -f '%Su' /opt/homebrew 2>/dev/null || echo NO-PREFIX)"
