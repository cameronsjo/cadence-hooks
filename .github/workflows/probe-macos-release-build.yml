name: probe-macos-release-build

# Temporary. Runs release.yml's two macOS build rows on macos-latest without a
# tag, so the runner move is proven before a release depends on it. Deleted in
# the same PR before merge.

on:
  push:
    branches: [ci/release-macos-hosted]

permissions:
  contents: read

jobs:
  build:
    name: Probe ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --target "${TARGET}"

      - name: Create tarball and report architecture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          echo "runner: ${RUNNER_NAME} ${RUNNER_ENVIRONMENT:-unknown} $(uname -m)"
          BIN="target/${TARGET}/release/cadence-hooks"
          file "${BIN}"
          lipo -archs "${BIN}"
          ARCHIVE="cadence-hooks-v0.0.0-probe-${MATRIX_NAME}.tar.gz"
          tar -czf "${ARCHIVE}" -C "target/${TARGET}/release" cadence-hooks
          tar -tzf "${ARCHIVE}"
