name: Prepare Release

# Keeps one open `chore(main): release X.Y.Z` PR current with main, derived
# from CHANGELOG.md's [Unreleased] section (cadence-ecosystem ADR-0044). The
# nightly ship.yml gate merges it; auto-tag.yml then tags the new version.
#
# Two jobs, so the App private key never shares a job with the repo's build
# tooling (security review I-1):
#
# - `compute`: no secrets. Runs scripts/prepare-release.sh (`make bump`, the
#   Cargo.lock version lines, a heading added under [Unreleased]), checks the
#   diff has the shape the ship gate accepts, and uploads the three files.
# - `publish`: `release` environment. Mints the Forge Bellows token and writes
#   the files as one commit through the REST API, so GitHub signs it. A
#   `git push` commit would be unsigned and the gate would refuse it.
#
# The release PR is the one moving part: an empty [Unreleased] closes it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One prepare at a time. A newer push queues behind the running one; the
# publish job also skips when main has moved past the commit it computed from.
concurrency:
  group: prepare-release
  cancel-in-progress: false

env:
  RELEASE_BRANCH: prepare-release/main

jobs:
  compute:
    name: Compute release files
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      action: ${{ steps.prepare.outputs.action }}
      version: ${{ steps.prepare.outputs.version }}
      bump: ${{ steps.prepare.outputs.bump }}
      branch_exists: ${{ steps.prepare.outputs.branch_exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test prepare-release.sh
        run: bash scripts/test-prepare-release.sh

      - name: Prepare
        id: prepare
        run: |
          set -euo pipefail
          bash scripts/prepare-release.sh > "$RUNNER_TEMP/prepare.out"
          cat "$RUNNER_TEMP/prepare.out"
          action="$(sed -n 's/^action=//p' "$RUNNER_TEMP/prepare.out")"
          version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/prepare.out")"
          bump="$(sed -n 's/^bump=//p' "$RUNNER_TEMP/prepare.out")"
          # A close with no release branch has nothing to do, so the token
          # job (and its environment deployment) is skipped on most pushes.
          rc=0
          git ls-remote --exit-code origin "refs/heads/${RELEASE_BRANCH}" > /dev/null || rc=$?
          case "$rc" in
            0) branch_exists=true ;;
            2) branch_exists=false ;; # --exit-code: no matching ref
            *) echo "::error::git ls-remote failed (exit ${rc})"; exit 1 ;;
          esac
          case "$action" in
            close) version='' bump='' ;;
            open)
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$version'"; exit 1; }
              [[ "$bump" =~ ^(patch|minor)$ ]] || { echo "::error::bad bump '$bump'"; exit 1; } ;;
            *) echo "::error::bad action '$action'"; exit 1 ;;
          esac
          # Values are checked above, so plain key=value lines are safe.
          printf 'action=%s\nversion=%s\nbump=%s\nbranch_exists=%s\n' "$action" "$version" "$bump" "$branch_exists" >> "$GITHUB_OUTPUT"

      # The ship gate's content rules, checked before anything is published:
      # only the three allowlisted files change, Cargo.toml by one line, and
      # CHANGELOG.md deletes nothing.
      - name: Check the diff shape
        if: steps.prepare.outputs.action == 'open'
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | LC_ALL=C sort | tr '\n' ' ')"
          [[ "$changed" == "CHANGELOG.md Cargo.lock Cargo.toml " ]] \
            || { echo "::error::unexpected changed files: $changed"; exit 1; }
          read -r adds dels _ < <(git diff --numstat -- CHANGELOG.md)
          [[ "$dels" == 0 && "$adds" -gt 0 ]] || { echo "::error::CHANGELOG.md diff is +$adds -$dels"; exit 1; }
          read -r adds dels _ < <(git diff --numstat -- Cargo.toml)
          [[ "$adds" == 1 && "$dels" == 1 ]] || { echo "::error::Cargo.toml diff is +$adds -$dels"; exit 1; }
          # Cargo.lock: every changed line is a `version = "…"` line.
          other="$(git diff -U0 -- Cargo.lock | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' | grep -cvE '^[-+]version = "' || true)"
          [[ "$other" == 0 ]] || { echo "::error::Cargo.lock changes ${other} line(s) other than version lines"; exit 1; }
          mkdir -p "$RUNNER_TEMP/release-files"
          cp Cargo.toml Cargo.lock CHANGELOG.md "$RUNNER_TEMP/release-files/"

      - name: Upload release files
        if: steps.prepare.outputs.action == 'open'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Update release PR
    needs: compute
    if: needs.compute.outputs.action == 'open' || needs.compute.outputs.branch_exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # RELEASE_APP_PRIVATE_KEY lives only in the `release` environment, whose
    # deployment policy allows `main` and `v*` tags (ADR-0044 (i)).
    environment: release
    permissions:
      contents: read # sparse checkout of .github/scripts
    steps:
      # main's own copy of the commit script, at the commit `compute` read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download release files
        if: needs.compute.outputs.action == 'open'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: ${{ runner.temp }}/release-files

      # Contents and pull requests on this repo only: write the release
      # branch, and open, retitle, or close its PR.
      - name: Generate Forge Bellows token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open, update, or close the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BASE_SHA: ${{ github.sha }}
          ACTION: ${{ needs.compute.outputs.action }}
          VERSION: ${{ needs.compute.outputs.version }}
          BUMP: ${{ needs.compute.outputs.bump }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$ACTION" =~ ^(open|close)$ ]] || { echo "::error::bad action"; exit 1; }
          [[ "$APP_SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad app slug"; exit 1; }
          bot="${APP_SLUG}[bot]"

          # A newer push has its own run queued behind this one; let it act.
          head="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$head" != "$BASE_SHA" ]]; then
            echo "::notice::main moved from ${BASE_SHA} to ${head}; the newer run updates the release PR."
            exit 0
          fi

          prs="$(gh api "repos/${REPO}/pulls?state=open&base=main&head=${OWNER}:${RELEASE_BRANCH}&per_page=100")"
          jq -e 'type == "array"' <<< "$prs" > /dev/null || { echo "::error::open-PR list is not an array"; exit 1; }
          foreign="$(jq -r --arg bot "$bot" '[.[] | select(.user.login != $bot) | .number] | join(" ")' <<< "$prs")"
          [[ -z "$foreign" ]] || { echo "::error::PR(s) ${foreign} use ${RELEASE_BRANCH} but were not opened by ${bot}; close them first"; exit 1; }
          pr="$(jq -r '.[0].number // ""' <<< "$prs")"

          if [[ "$ACTION" == close ]]; then
            if [[ -n "$pr" ]]; then
              gh api -X PATCH "repos/${REPO}/pulls/${pr}" -f state=closed > /dev/null
              echo "Closed #${pr}: [Unreleased] is empty."
            fi
            exists="$(gh api "repos/${REPO}/git/matching-refs/heads/${RELEASE_BRANCH}" \
              | jq --arg r "refs/heads/${RELEASE_BRANCH}" 'any(.[]; .ref == $r)')"
            if [[ "$exists" == true ]]; then
              gh api -X DELETE "repos/${REPO}/git/refs/heads/${RELEASE_BRANCH}"
            fi
            echo "Nothing unreleased."
            exit 0
          fi

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version"; exit 1; }
          [[ "$BUMP" =~ ^(patch|minor)$ ]] || { echo "::error::bad bump"; exit 1; }
          title="chore(main): release ${VERSION}"
          result="$(BRANCH="$RELEASE_BRANCH" FILES_DIR="$RUNNER_TEMP/release-files" MESSAGE="$title" \
            bash .github/scripts/commit-via-api.sh Cargo.toml Cargo.lock CHANGELOG.md)"
          echo "$result"

          # shellcheck disable=SC2016 # backticks are Markdown, not command substitution
          body="$(printf 'Release %s (%s bump), prepared from `CHANGELOG.md` `[Unreleased]` at %s by %s.\n\nThe nightly ship gate merges this PR when it verifies (ADR-0044). Do not push to this branch: every push to main rebuilds it, and the gate refuses commits the App did not make.\n' \
            "$VERSION" "$BUMP" "$BASE_SHA" "$RUN_URL")"
          if [[ -n "$pr" ]]; then
            gh api -X PATCH "repos/${REPO}/pulls/${pr}" -f title="$title" -f body="$body" > /dev/null
            echo "Updated #${pr}: ${title}"
          else
            gh api -X POST "repos/${REPO}/pulls" -f title="$title" -f head="$RELEASE_BRANCH" \
              -f base=main -f body="$body" --jq '"Opened #\(.number): \(.title)"'
          fi
