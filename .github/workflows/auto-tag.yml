name: Auto Tag

on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: write

# Serialize runs. Each run produces a unique artifact (a distinct git tag,
# release, or formula update) so cancel-in-progress is false — we want
# both to land in order, not lose the second to a cancellation.
concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag version bump
    runs-on: ubuntu-latest
    steps:
      - name: Generate Forge Bellows token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # client-id, not the deprecated app-id. The action resolves
          # `getInput("client-id") || getInput("app-id")` into one value it
          # hands to createAppAuth as appId, so the numeric App ID in
          # RELEASE_APP_ID stays valid — a rename, not a credential change.
          # The rename REQUIRES v3: v2 has no client-id input at all
          # (its app-id is required), so renaming on v2 breaks the job.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract version and check for existing tag
        id: check
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
