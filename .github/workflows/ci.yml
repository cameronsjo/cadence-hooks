name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release stamp on main can put an open PR's [Unreleased] bullet under the
  # new version heading with a clean merge (CLAUDE.md, Release). The PR merge
  # commit's first parent is main, so the diff against it is what the merge
  # adds. The App's release PR adds that heading on purpose and is skipped.
  changelog:
    name: CHANGELOG sections
    if: github.event_name == 'pull_request' && github.head_ref != 'prepare-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test the check
        run: bash scripts/test-check-changelog-sections.sh

      - name: New bullets sit under [Unreleased]
        run: bash scripts/check-changelog-sections.sh HEAD^1

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Surface a Windows-only portability regression even when Linux is green.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --no-fail-fast: cargo otherwise stops after the first test binary that
      # fails and never builds the remaining crates', so a red crate silently
      # takes every other crate's tests out of the run. Measured on the
      # red-tests branch (#551): the cadence crate failed with 5, aborted, and
      # cadence-hooks-core's 718 tests never executed — CI reported the 5 as if
      # it were the whole picture.
      - name: Run tests
        run: cargo test --workspace --no-fail-fast

      # Wall-clock flood budgets are opt-in: run the shipped profile with
      # one test thread so debug overhead and parallel tests do not decide them.
      - name: Run release timing budgets
        env:
          CADENCE_TIMING_TESTS: '1'
        run: cargo test --release --workspace --no-fail-fast -- --test-threads=1

      # The runner starts with no ledgers, so any row in the default metrics
      # dir now came from a test that logged without a scratch
      # CADENCE_METRICS_DIR (#1586). On a workstation those rows pollute the
      # operator's live ledgers.
      - name: Tests leave the default metrics dir empty
        if: ${{ !cancelled() }}
        shell: bash
        run: bash scripts/check-metrics-isolation.sh

  openspec:
    # openspec/ holds the capability specs and the change proposals (#1446).
    # A spec or change that the CLI cannot parse is silently skipped by
    # `openspec list` and by an agent's /opsx commands, so a malformed file
    # must fail here instead.
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate specs and changes
        # The runner image's Node is enough (the CLI needs >= 20.19). The CLI
        # itself comes from scripts/openspec/package-lock.json, integrity
        # hashes included, with install scripts off.
        run: |
          node --version
          scripts/openspec.sh validate --all --strict --no-interactive

      - name: Generated skills use the pinned CLI
        # `openspec update` resets the generated skills to a bare, unpinned
        # `openspec` grant that covers every subcommand. Rerunning the
        # localize script must change nothing, and it fails on a grant it
        # does not recognize.
        run: |
          set -euo pipefail
          bash scripts/openspec-localize.sh
          if ! git diff --exit-code -- .claude .agents/skills; then
            echo "::error::generated OpenSpec skills are not localized to the pinned CLI; run scripts/openspec-localize.sh and commit the result"
            exit 1
          fi
