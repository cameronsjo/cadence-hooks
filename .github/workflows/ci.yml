name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Surface a Windows-only portability regression even when Linux is green.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --no-fail-fast: cargo otherwise stops after the first test binary that
      # fails and never builds the remaining crates', so a red crate silently
      # takes every other crate's tests out of the run. Measured on the
      # red-tests branch (#551): the cadence crate failed with 5, aborted, and
      # cadence-hooks-core's 718 tests never executed — CI reported the 5 as if
      # it were the whole picture.
      - name: Run tests
        run: cargo test --workspace --no-fail-fast

      # Wall-clock flood budgets are opt-in: run the shipped profile with
      # one test thread so debug overhead and parallel tests do not decide them.
      - name: Run release timing budgets
        env:
          CADENCE_TIMING_TESTS: '1'
        run: cargo test --release --workspace --no-fail-fast -- --test-threads=1

  openspec:
    # openspec/ holds the capability specs and the change proposals (#1446).
    # A spec or change that the CLI cannot parse is silently skipped by
    # `openspec list` and by an agent's /opsx commands, so a malformed file
    # must fail here instead.
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate specs and changes
        # The runner image's Node is enough (the CLI needs >= 20.19). The CLI
        # itself comes from scripts/openspec/package-lock.json, integrity
        # hashes included, with install scripts off.
        run: |
          node --version
          scripts/openspec.sh validate --all --strict --no-interactive
