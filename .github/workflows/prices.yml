name: Prices

# crates/metrics/prices.json is generated by scripts/generate-prices.py from the
# published pricing table (cadence-hooks#866). Two jobs, split so a pull request
# never depends on a third-party site's uptime:
#
# - `check`: offline, on every PR and push that touches the table or its
#   generator. Runs the generator's unit tests and `--check`.
# - `refresh`: network, weekly and on manual dispatch only. Regenerates the
#   table and opens a PR when a rate moved. `workflow_dispatch` only appears
#   once this file is on the default branch, so the first dispatch happens
#   after merge, before the first cron fires.

on:
  push:
    branches: [main]
    paths:
      - crates/metrics/prices.json
      - scripts/generate-prices.py
      - scripts/test_generate_prices.py
      - scripts/testdata/pricing-page.md
      - .github/workflows/prices.yml
  pull_request:
    branches: [main]
    paths:
      - crates/metrics/prices.json
      - scripts/generate-prices.py
      - scripts/test_generate_prices.py
      - scripts/testdata/pricing-page.md
      - .github/workflows/prices.yml
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check prices.json
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the generator
        run: python3 scripts/test_generate_prices.py

      - name: Check the committed table
        run: python3 scripts/generate-prices.py --check

  refresh:
    name: Refresh prices.json
    # Main only: a dispatch from another branch would otherwise push a price
    # PR built from that branch's generator.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One refresh at a time; a second queued run would only race the first
    # to the same PR.
    concurrency:
      group: prices-refresh
      cancel-in-progress: false
    # Deliberately no ANTHROPIC_API_KEY or other secret in this job's env: the
    # generator's output becomes a public PR body, and log masking does not
    # cover PR bodies.
    steps:
      # A GITHUB_TOKEN-authored PR spawns no `pull_request` workflows, and the
      # ruleset requires no checks, so a price PR would be mergeable with zero
      # tests run. The Forge Bellows app token is minted exactly as in
      # auto-tag.yml so the PR runs CI like any other.
      - name: Generate Forge Bellows token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # No persisted credentials: the generator runs with no token in
      # .git/config, and the push below names its credential explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # A refresh PR left unreviewed would otherwise be joined by a new one
      # every Monday. Only this app's same-repo PRs count: anyone can open a
      # fork PR with a matching branch name, and that must not suppress the
      # refresh.
      - name: Skip while a refresh PR is open
        id: open
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json headRefName,isCrossRepository,author |
            jq --arg author "app/${APP_SLUG}" \
              '[.[] | select((.isCrossRepository | not) and .author.login == $author and (.headRefName | startswith("chore/prices-refresh-")))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "A refresh PR is already open; skipping."
          fi

      # --allow-removals: retired rows do leave the page, and without the flag
      # the job would fail every week from then on. Removed rows are kept and
      # named in a NOTE instead.
      - name: Regenerate from the pricing page
        if: steps.open.outputs.count == '0'
        run: |
          python3 scripts/generate-prices.py --refresh --allow-removals \
            --body-file "$RUNNER_TEMP/prices-body.md"

      - name: Open a PR when a rate moved
        if: steps.open.outputs.count == '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet -- crates/metrics/prices.json; then
            echo "No price drift."
            exit 0
          fi
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          # The run id keeps a same-day re-dispatch from colliding with a
          # branch an earlier run left behind.
          branch="chore/prices-refresh-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add crates/metrics/prices.json
          git commit -m "chore(metrics): refresh prices.json from the published pricing table"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore(metrics): refresh prices.json from the published pricing table" \
            --body-file "$RUNNER_TEMP/prices-body.md"
