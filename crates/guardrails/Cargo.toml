[package]
name = "cadence-hooks-guardrails"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Git guardrails hooks: push protection, gh write guards, idle detection"

[dependencies]
# `identity_matches`: warn-going-public reads the redaction term source
# through the tier that owns it (cadence-hooks#793).
cadence-hooks-cadence.workspace = true
cadence-hooks-core.workspace = true
cadence-hooks-metrics.workspace = true
# `unstaged_plan_at_commit`: the commit-time plan-tick pre-arm reuses the
# session crate's plan scan (cadence-hooks#691).
cadence-hooks-session.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# `geteuid` only: the dubious-ownership check in warn-main-branch.
libc.workspace = true

[dev-dependencies]
cadence-hooks-core = { workspace = true, features = ["test-builders"] }
tempfile = "3"
